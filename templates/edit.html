{% extends 'base.html' %}

{% block content %}
<h2 class="mb-3">Edit Indicator Record</h2>

<div class="card p-4 col-md-6">
    <form method="POST" action="/edit/{{ item.id }}">
        <div class="mb-3">
            <label class="form-label">Country Code</label>
            <input type="text" name="country_code" class="form-control" value="{{ item.country_code }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Country Name</label>
            <input type="text" name="country_name" class="form-control" value="{{ item.country_name }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Indicator Name</label>
            <input type="text" name="indicator_name" class="form-control" value="{{ item.indicator_name }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Value</label>
            <input type="number" step="any" name="value" class="form-control" value="{{ item.value }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Year</label>
            <input type="number" name="year" class="form-control" value="{{ item.year }}" required>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="/saved" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
